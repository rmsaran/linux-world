- name: Remove Syncthing
  hosts: localhost
  connection: local
  become: true
  tasks:
    - name: Stop and disable Syncthing
      ansible.builtin.systemd:
        name: syncthing@serverux.service
        enabled: false
        state: stopped

    - name: Remove Syncthing firewall rules
      community.general.ufw:
        rule: allow
        port: "22000"
        proto: "{{ item }}"
        src: 192.168.1.0/24
        delete: true
      loop: [tcp, udp]

    - name: Uninstall Syncthing package
      ansible.builtin.apt:
        name: syncthing
        state: absent
        purge: true
        autoremove: true
