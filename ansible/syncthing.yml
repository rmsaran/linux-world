- name: Install and enable Syncthing
  hosts: localhost
  connection: local
  become: true
  tasks:
    - name: Install Syncthing
      ansible.builtin.apt:
        name: syncthing
        state: present
        update_cache: true

    - name: Enable and start Syncthing for serverux
      ansible.builtin.systemd:
        name: syncthing@serverux.service
        enabled: true
        state: started

    - name: Allow Syncthing sync port from LAN
      community.general.ufw:
        rule: allow
        port: "22000"
        proto: "{{ item }}"
        src: 192.168.1.0/24
        comment: Syncthing
      loop: [tcp, udp]
