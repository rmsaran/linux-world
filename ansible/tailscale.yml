- name: Install and enable Tailscale
  hosts: localhost
  connection: local
  become: true

  tasks:
    - name: Install the Tailscale snap
      community.general.snap:
        name: tailscale
        state: present

    - name: Keep tailscaled enabled and running
      ansible.builtin.systemd:
        name: snap.tailscale.tailscaled
        enabled: true
        state: started

    - name: Check Tailscale login state
      ansible.builtin.command: /snap/bin/tailscale status
      register: ts_status
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Report login state
      ansible.builtin.debug:
        msg: "{{ 'Tailscale is logged in.' if ts_status.rc == 0 else 'Tailscale is NOT logged in. Run: sudo tailscale up' }}"
