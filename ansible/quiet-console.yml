- name: Hide firmware error
  hosts: localhost
  connection: local
  become: true
  tasks:
    - name: Add console log level drop-in
      ansible.builtin.copy:
        dest: /etc/default/grub.d/99-quiet-console.cfg
        content: |
          GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT loglevel=3"
        owner: root
        group: root
        mode: "0644"
      notify: Update GRUB

  handlers:
    - name: Update GRUB
      ansible.builtin.command: update-grub
